services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    # DATABASE_HOST/PORT/NAME/USER/PASSWORD in .env point at a managed Neon Postgres
    # instance (free tier) — no local postgres container needed. SSL is auto-enabled
    # for any non-localhost DATABASE_HOST (see app/database.py).
    command: sh -c "alembic upgrade head && uvicorn app.main:get_app --factory --host 0.0.0.0 --port 8000"
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
